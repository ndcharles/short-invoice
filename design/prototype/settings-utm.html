<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Settings · UTM Builder · 4th.link</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="shared.css" />
</head>
<body>
  <div id="app"></div>
  <script src="shell.js"></script>
  <script src="settings-shell.js"></script>
  <script>
    const defaultsCard = settingsCard({
      title: 'Default parameter values',
      subtitle: 'Pre-populated when someone opens the Create Campaign modal. Blank = leave the field empty.',
      body: `
        ${settingsRow({
          label: 'Default source',
          help: 'utm_source — the referrer (e.g. <code style="background:var(--muted);padding:1px 4px;border-radius:3px">google</code>, <code style="background:var(--muted);padding:1px 4px;border-radius:3px">newsletter</code>).',
          control: `<input class="input" placeholder="e.g. newsletter" value="newsletter" />`
        })}
        ${settingsRow({
          label: 'Default medium',
          help: 'utm_medium — marketing medium (e.g. <code style="background:var(--muted);padding:1px 4px;border-radius:3px">cpc</code>, <code style="background:var(--muted);padding:1px 4px;border-radius:3px">email</code>).',
          control: `<input class="input" placeholder="e.g. email" value="email" />`
        })}
        ${settingsRow({
          label: 'Default campaign',
          help: 'utm_campaign — leave blank to require entry per campaign.',
          control: `<input class="input" placeholder="e.g. q4_launch" value="" />`
        })}
        ${settingsRow({
          label: 'Default folder',
          help: 'Where new campaigns land.',
          control: `
            <div class="setting-select">
              <select>
                <option>Campaigns</option>
                <option>Marketing</option>
                <option>Client work</option>
              </select>
              <span class="chev">${ICONS.chevronDown}</span>
            </div>
          `
        })}
      `
    });

    const presetsCard = settingsCard({
      title: 'Presets & templates',
      subtitle: 'One-click parameter combos users can pick from when creating a campaign.',
      body: `
        <div class="setting-list">
          <div class="setting-list-row preset-row">
            <div class="preset-badge" style="background:#4285F4">G</div>
            <div>
              <div class="primary">Google Ads</div>
              <div class="secondary">source: google · medium: cpc · content: {ad_id}</div>
            </div>
            <div class="row-actions">
              <button class="icon-btn">${ICONS.edit}</button>
              <button class="icon-btn">${ICONS.duplicate}</button>
              <button class="icon-btn" style="color:var(--destructive)">${ICONS.trash}</button>
            </div>
          </div>
          <div class="setting-list-row preset-row">
            <div class="preset-badge" style="background:#0a66c2">L</div>
            <div>
              <div class="primary">LinkedIn Sponsored</div>
              <div class="secondary">source: linkedin · medium: social · campaign: {name}</div>
            </div>
            <div class="row-actions">
              <button class="icon-btn">${ICONS.edit}</button>
              <button class="icon-btn">${ICONS.duplicate}</button>
              <button class="icon-btn" style="color:var(--destructive)">${ICONS.trash}</button>
            </div>
          </div>
          <div class="setting-list-row preset-row">
            <div class="preset-badge" style="background:#d97706">N</div>
            <div>
              <div class="primary">Newsletter</div>
              <div class="secondary">source: newsletter · medium: email · content: {position}</div>
            </div>
            <div class="row-actions">
              <button class="icon-btn">${ICONS.edit}</button>
              <button class="icon-btn">${ICONS.duplicate}</button>
              <button class="icon-btn" style="color:var(--destructive)">${ICONS.trash}</button>
            </div>
          </div>
          <div class="setting-list-row preset-row">
            <div class="preset-badge" style="background:#000000">X</div>
            <div>
              <div class="primary">X / Twitter</div>
              <div class="secondary">source: x · medium: social · campaign: {name}</div>
            </div>
            <div class="row-actions">
              <button class="icon-btn">${ICONS.edit}</button>
              <button class="icon-btn">${ICONS.duplicate}</button>
              <button class="icon-btn" style="color:var(--destructive)">${ICONS.trash}</button>
            </div>
          </div>
          <div class="setting-list-row dashed">${ICONS.plus}<span style="margin-left:6px">Add preset</span></div>
        </div>
      `,
      foot: `<span>Tokens like <code style="background:white;padding:1px 5px;border-radius:3px;border:1px solid var(--border)">{name}</code>, <code style="background:white;padding:1px 5px;border-radius:3px;border:1px solid var(--border)">{ad_id}</code>, <code style="background:white;padding:1px 5px;border-radius:3px;border:1px solid var(--border)">{position}</code> are prompted at create time.</span><a href="#" style="color:var(--foreground);font-weight:500">Token reference \u2197</a>`
    });

    const formattingCard = settingsCard({
      title: 'URL formatting',
      subtitle: 'How values are encoded when building the final campaign URL.',
      body: `
        ${settingsRow({
          label: 'Encoding style',
          help: 'Standard follows RFC 3986 (spaces become <code style="background:var(--muted);padding:1px 4px;border-radius:3px">%20</code>). Lenient keeps <code style="background:var(--muted);padding:1px 4px;border-radius:3px">+</code> and other characters readable but may break in some analytics tools.',
          control: `
            <div class="setting-seg">
              <button class="active">Standard (RFC 3986)</button>
              <button>Lenient</button>
            </div>
          `
        })}
        ${settingsRow({
          label: 'Space character',
          help: 'How spaces inside parameter values are represented.',
          control: `
            <div class="setting-seg">
              <button class="active"><code style="background:transparent">%20</code></button>
              <button><code style="background:transparent">+</code></button>
              <button><code style="background:transparent">_</code></button>
            </div>
          `
        })}
        ${settingsRow({
          label: 'Lowercase parameters',
          help: 'Automatically lowercase all utm_* values before appending. Recommended for consistent analytics segmentation.',
          control: `
            <label class="toggle on" onclick="this.classList.toggle('on')" data-dirty="true">
              <div class="toggle-switch"></div>
              <span style="font-size:13px;color:var(--muted-foreground)">On</span>
            </label>
          `
        })}
        ${settingsRow({
          label: 'Strip existing UTMs',
          help: 'If the destination URL already contains utm_* parameters, remove them before appending the new ones.',
          control: `
            <label class="toggle" onclick="this.classList.toggle('on')" data-dirty="true">
              <div class="toggle-switch"></div>
              <span style="font-size:13px;color:var(--muted-foreground)">Off</span>
            </label>
          `
        })}
      `
    });

    const content = `
      <div class="settings-layout">
        ${renderSettingsNav('utm')}
        <div class="settings-main">
          <div class="settings-hero">
            <div>
              <h1>UTM Builder</h1>
              <p>Parameter defaults, presets, and how URLs get formatted.</p>
            </div>
          </div>
          ${defaultsCard}
          ${presetsCard}
          ${formattingCard}
        </div>
      </div>
      ${renderSaveBar()}
    `;
    renderShell({ activeNav: 'settings', activeSub: '', children: content });
    initSaveBar();
    function toggleActionMenu(){}
  </script>
</body>
</html>
