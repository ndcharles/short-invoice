<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Multi-Tool Workspace · Wireframe canvas</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; font-family: 'Inter', system-ui, sans-serif; }
    .frame-wrap { width: 100%; height: 100%; position: relative; background: white; }
    .frame-wrap iframe {
      border: 0;
      display: block;
      transform-origin: top left;
    }
    .frame-open {
      position: absolute;
      top: 8px; right: 8px;
      z-index: 5;
      display: inline-flex; align-items: center; gap: 4px;
      padding: 4px 8px;
      background: rgba(10,10,10,0.85);
      color: white;
      font-size: 11px;
      font-weight: 500;
      border-radius: 6px;
      text-decoration: none;
      opacity: 0;
      transition: opacity 120ms;
    }
    .frame-wrap:hover .frame-open { opacity: 1; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="design_canvas.jsx"></script>

  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    // Preview: renders an iframe of a real prototype page scaled to fit the artboard.
    function ScreenPreview({ src, designWidth = 1280, designHeight = 800 }) {
      const wrapRef = useRef(null);
      const [scale, setScale] = useState(1);

      useEffect(() => {
        const wrap = wrapRef.current;
        if (!wrap) return;
        const ro = new ResizeObserver(() => {
          const rect = wrap.getBoundingClientRect();
          const s = Math.min(rect.width / designWidth, rect.height / designHeight);
          setScale(s);
        });
        ro.observe(wrap);
        return () => ro.disconnect();
      }, [designWidth, designHeight]);

      return (
        <div ref={wrapRef} className="frame-wrap">
          <a className="frame-open" href={src} target="_blank" rel="noreferrer">
            Open ↗
          </a>
          <iframe
            src={src}
            scrolling="no"
            style={{
              width: designWidth + 'px',
              height: designHeight + 'px',
              transform: `scale(${scale})`,
              pointerEvents: 'none',
            }}
          />
        </div>
      );
    }

    function App() {
      return (
        <DesignCanvas
          title="Multi-Tool Workspace · Wireframe"
          subtitle="Basecoat UI · dub.co-inspired · Monochrome hi-fi"
          background="#fafafa"
        >
          <DCSection id="url-shortener" title="URL Shortener" subtitle="Primary flow — list, create, edit">
            <DCArtboard id="links" label="Links (default)" width={1280} height={800}>
              <ScreenPreview src="prototype/links.html" designWidth={1280} designHeight={800} />
            </DCArtboard>
            <DCArtboard id="create" label="Create Link modal" width={1280} height={900}>
              <ScreenPreview src="prototype/create-link.html" designWidth={1280} designHeight={900} />
            </DCArtboard>
            <DCArtboard id="edit" label="Edit Link (full page)" width={1280} height={900}>
              <ScreenPreview src="prototype/edit-link.html" designWidth={1280} designHeight={900} />
            </DCArtboard>
          </DCSection>

          <DCSection id="utm-builder" title="UTM Builder" subtitle="List, create, edit — no sub-nav">
            <DCArtboard id="utms" label="Campaigns (default)" width={1280} height={800}>
              <ScreenPreview src="prototype/utms.html" designWidth={1280} designHeight={800} />
            </DCArtboard>
            <DCArtboard id="create-utm" label="Create campaign modal" width={1280} height={900}>
              <ScreenPreview src="prototype/create-utm.html" designWidth={1280} designHeight={900} />
            </DCArtboard>
            <DCArtboard id="edit-utm" label="Edit campaign" width={1280} height={900}>
              <ScreenPreview src="prototype/edit-utm.html" designWidth={1280} designHeight={900} />
            </DCArtboard>
            <DCArtboard id="utms-empty" label="Empty state" width={1280} height={800}>
              <ScreenPreview src="prototype/utms-empty.html" designWidth={1280} designHeight={800} />
            </DCArtboard>
            <DCArtboard id="utm-action" label="Row action menu" width={1280} height={800}>
              <ScreenPreview src="prototype/utm-action-menu.html" designWidth={1280} designHeight={800} />
            </DCArtboard>
          </DCSection>

          <DCSection id="invoice-generator" title="Invoice Generator" subtitle="List with status tabs, create, edit, analytics">
            <DCArtboard id="invoices" label="Invoices (default)" width={1280} height={800}>
              <ScreenPreview src="prototype/invoices.html" designWidth={1280} designHeight={800} />
            </DCArtboard>
            <DCArtboard id="create-invoice" label="Create invoice modal" width={1280} height={1000}>
              <ScreenPreview src="prototype/create-invoice.html" designWidth={1280} designHeight={1000} />
            </DCArtboard>
            <DCArtboard id="edit-invoice" label="Edit invoice (partial paid + rail)" width={1280} height={1400}>
              <ScreenPreview src="prototype/edit-invoice.html" designWidth={1280} designHeight={1400} />
            </DCArtboard>
            <DCArtboard id="edit-invoice-paid" label="Edit invoice (paid — receipt mode)" width={1280} height={1400}>
              <ScreenPreview src="prototype/edit-invoice.html?inv=1" designWidth={1280} designHeight={1400} />
            </DCArtboard>
            <DCArtboard id="invoices-empty" label="Empty state" width={1280} height={800}>
              <ScreenPreview src="prototype/invoices-empty.html" designWidth={1280} designHeight={800} />
            </DCArtboard>
            <DCArtboard id="invoice-action" label="Row action menu" width={1280} height={800}>
              <ScreenPreview src="prototype/invoice-action-menu.html" designWidth={1280} designHeight={800} />
            </DCArtboard>
            <DCArtboard id="invoice-analytics" label="Analytics · Overview" width={1280} height={1100}>
              <ScreenPreview src="prototype/invoice-analytics.html" designWidth={1280} designHeight={1100} />
            </DCArtboard>
            <DCArtboard id="invoice-analytics-payments" label="Analytics · Payments" width={1280} height={900}>
              <ScreenPreview src="prototype/invoice-analytics.html?tab=payments" designWidth={1280} designHeight={900} />
            </DCArtboard>
            <DCArtboard id="invoice-analytics-clients" label="Analytics · Clients" width={1280} height={1100}>
              <ScreenPreview src="prototype/invoice-analytics.html?tab=clients" designWidth={1280} designHeight={1100} />
            </DCArtboard>
            <DCArtboard id="invoice-guide" label="How to Guide modal" width={1280} height={900}>
              <ScreenPreview src="prototype/invoice-guide.html" designWidth={1280} designHeight={900} />
            </DCArtboard>
          </DCSection>

          <DCSection id="settings" title="Settings" subtitle="Icon+label sub-nav · floating Save bar on dirty">
            <DCArtboard id="settings-general"   label="General"        width={1280} height={1400}>
              <ScreenPreview src="prototype/settings.html"            designWidth={1280} designHeight={1400} />
            </DCArtboard>
            <DCArtboard id="settings-shortener" label="URL Shortener"  width={1280} height={1300}>
              <ScreenPreview src="prototype/settings-shortener.html"  designWidth={1280} designHeight={1300} />
            </DCArtboard>
            <DCArtboard id="settings-utm"       label="UTM Builder"    width={1280} height={1300}>
              <ScreenPreview src="prototype/settings-utm.html"        designWidth={1280} designHeight={1300} />
            </DCArtboard>
            <DCArtboard id="settings-invoice"   label="Invoice"        width={1280} height={2200}>
              <ScreenPreview src="prototype/settings-invoice.html"    designWidth={1280} designHeight={2200} />
            </DCArtboard>
          </DCSection>

          <DCSection id="states" title="URL Shortener — States & sub-views" subtitle="Empty, action menu, analytics">
            <DCArtboard id="empty" label="Empty state" width={1280} height={800}>
              <ScreenPreview src="prototype/links-empty.html" designWidth={1280} designHeight={800} />
            </DCArtboard>
            <DCArtboard id="action" label="Row action menu" width={1280} height={800}>
              <ScreenPreview src="prototype/action-menu.html" designWidth={1280} designHeight={800} />
            </DCArtboard>
            <DCArtboard id="analytics" label="Analytics (preview)" width={1280} height={1200}>
              <ScreenPreview src="prototype/analytics.html" designWidth={1280} designHeight={1200} />
            </DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
