<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Analytics · 4th.link</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="shared.css"/>
  <style>
    .analytics-toolbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 4px 0 16px;
    }
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }
    .stat-card { padding: 12px 14px; }
    .stat-card .stat-value { font-size: 20px; margin-top: 4px; }
    .stat-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
    }
    .stat-card .stat-label {
      font-size: 11px;
      color: var(--muted-foreground);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-weight: 500;
      display: flex; align-items: center; gap: 5px;
    }
    .stat-card .stat-value {
      font-size: 22px;
      font-weight: 600;
      margin-top: 6px;
      color: var(--foreground);
      font-variant-numeric: tabular-nums;
    }
    .stat-card .stat-delta {
      font-size: 11px;
      color: var(--muted-foreground);
      margin-top: 2px;
    }
    .chart-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
      margin-bottom: 12px;
    }
    .chart-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 14px;
    }
    .chart-title {
      font-size: 13px; font-weight: 600;
    }
    .chart-placeholder {
      height: 220px;
      background: repeating-linear-gradient(
        to right,
        transparent 0,
        transparent 79px,
        var(--border) 79px,
        var(--border) 80px
      );
      position: relative;
      border-bottom: 1px solid var(--border);
    }
    .chart-placeholder svg {
      width: 100%; height: 100%;
    }
    .split {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    .split + .split { margin-top: 12px; }
    .split-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
    }
    .split-card h4 {
      margin: 0 0 12px;
      font-size: 13px; font-weight: 600;
      display: flex; align-items: center; justify-content: space-between;
    }
    .bar-row {
      display: grid;
      grid-template-columns: 20px 1fr 40px;
      gap: 10px;
      align-items: center;
      padding: 6px 0;
      font-size: 12px;
    }
    .bar-row + .bar-row { border-top: 1px solid var(--border); }
    .bar-flag {
      font-size: 12px;
    }
    .bar-track {
      background: var(--muted);
      height: 6px;
      border-radius: 3px;
      overflow: hidden;
      position: relative;
    }
    .bar-fill {
      background: var(--foreground);
      height: 100%;
      border-radius: 3px;
    }
    .bar-count {
      text-align: right;
      color: var(--muted-foreground);
      font-variant-numeric: tabular-nums;
    }
    .placeholder-veil {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 10px;
      background: var(--muted);
      color: var(--muted-foreground);
      border: 1px solid var(--border);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-weight: 500;
    }
  </style>
</head>
<body>

</html>
