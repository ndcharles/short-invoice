<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Settings · URL Shortener · 4th.link</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="shared.css" />
</head>
<body>
  <div id="app"></div>
  <script src="shell.js"></script>
  <script src="settings-shell.js"></script>
  <script>
    const domainsCard = settingsCard({
      title: 'Domains',
      subtitle: 'Manage the short-link domains your team can use.',
      body: `
        ${settingsRow({
          label: 'Default domain',
          help: 'New short links use this domain unless overridden.',
          control: `
            <div class="setting-select">
              <select>
                <option>4th.link</option>
                <option>ggl.link</option>
                <option>acme.short</option>
              </select>
              <span class="chev">${ICONS.chevronDown}</span>
            </div>
          `
        })}
        ${settingsRow({
          label: 'Custom domains',
          help: 'Add and verify your own domains via CNAME / A records.',
          control: `
            <div class="setting-list">
              <div class="setting-list-row domain-row">
                <div class="domain-favicon">4</div>
                <div>
                  <div class="primary">4th.link</div>
                  <div class="secondary">Primary · SSL enabled</div>
                </div>
                <span class="tag green">Active</span>
                <span class="secondary">Added Aug 12</span>
                <button class="icon-btn">${ICONS.more}</button>
              </div>
              <div class="setting-list-row domain-row">
                <div class="domain-favicon" style="background:#525252">G</div>
                <div>
                  <div class="primary">ggl.link</div>
                  <div class="secondary">SSL enabled</div>
                </div>
                <span class="tag green">Active</span>
                <span class="secondary">Added Jul 2</span>
                <button class="icon-btn">${ICONS.more}</button>
              </div>
              <div class="setting-list-row domain-row">
                <div class="domain-favicon" style="background:#a3a3a3">A</div>
                <div>
                  <div class="primary">acme.short</div>
                  <div class="secondary">Verify CNAME: <code style="background:var(--muted);padding:1px 5px;border-radius:3px">cname.4th.link</code></div>
                </div>
                <span class="tag yellow">Pending</span>
                <span class="secondary">Added today</span>
                <button class="icon-btn">${ICONS.more}</button>
              </div>
              <div class="setting-list-row dashed">
                ${ICONS.plus}<span style="margin-left:6px">Add custom domain</span>
              </div>
            </div>
          `
        })}
        ${settingsRow({
          label: 'Root domain redirection',
          help: 'When someone visits the domain root (e.g. <strong>4th.link</strong>) instead of a short link, send them to this URL.',
          control: `
            <input class="input" placeholder="https://acme.co" value="https://acme.co" />
            <div style="font-size:11px;color:var(--muted-foreground)">Leave empty to show a 404. Applies per domain \u2014 configure other domains from the list above.</div>
          `
        })}
      `
    });

    const linkDefaultsCard = settingsCard({
      title: 'Link defaults',
      subtitle: 'Values pre-filled on the Create Link modal. Individual links can still override any of these.',
      body: `
        ${settingsRow({
          label: 'Default folder',
          help: '',
          control: `
            <div class="setting-select">
              <select>
                <option>Links</option>
                <option>Marketing</option>
                <option>Internal</option>
                <option>Client work</option>
              </select>
              <span class="chev">${ICONS.chevronDown}</span>
            </div>
          `
        })}
        ${settingsRow({
          label: 'Default expiration',
          help: 'How long new links stay active before returning a 404.',
          control: `
            <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
              <div class="setting-select" style="max-width:200px">
                <select>
                  <option>Never expire</option>
                  <option>7 days</option>
                  <option>30 days</option>
                  <option>90 days</option>
                  <option>1 year</option>
                  <option>Custom</option>
                </select>
                <span class="chev">${ICONS.chevronDown}</span>
              </div>
            </div>
          `
        })}
        ${settingsRow({
          label: 'Default tags',
          help: 'Auto-applied to every new link. Users can remove them on create.',
          control: `
            <div class="setting-toggle-list">
              <button class="setting-chip on"><span class="tag green" style="padding:0;background:transparent;color:currentColor;border:none">Internal</span> <span class="x">${ICONS.x}</span></button>
              <button class="setting-chip on"><span class="tag blue" style="padding:0;background:transparent;color:currentColor;border:none">Campaign</span> <span class="x">${ICONS.x}</span></button>
              <button class="setting-chip">${ICONS.plus}<span>Add tag</span></button>
            </div>
          `
        })}
        ${settingsRow({
          label: 'Cloak link (default)',
          help: 'When on, the destination URL is hidden behind a proxy page so the short link stays visible in the browser bar.',
          control: `
            <label class="toggle" onclick="this.classList.toggle('on')" data-dirty="true">
              <div class="toggle-switch"></div>
              <span style="font-size:13px;color:var(--muted-foreground)">Off</span>
            </label>
          `
        })}
        ${settingsRow({
          label: 'Custom preview fallback',
          help: 'Use a saved custom OG preview when the destination page has no OG tags, or when you explicitly turn off the fetched preview.',
          control: `
            <label class="toggle on" onclick="this.classList.toggle('on')" data-dirty="true">
              <div class="toggle-switch"></div>
              <span style="font-size:13px;color:var(--muted-foreground)">On</span>
            </label>
          `
        })}
      `
    });

    const content = `
      <div class="settings-layout">
        ${renderSettingsNav('shortener')}
        <div class="settings-main">
          <div class="settings-hero">
            <div>
              <h1>URL Shortener</h1>
              <p>Domains, root redirection, and defaults for every new short link.</p>
            </div>
          </div>
          ${domainsCard}
          ${linkDefaultsCard}
        </div>
      </div>
      ${renderSaveBar()}
    `;
    renderShell({ activeNav: 'settings', activeSub: '', children: content });
    initSaveBar();
    function toggleActionMenu(){}
  </script>
</body>
</html>
