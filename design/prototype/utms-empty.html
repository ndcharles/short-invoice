<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>UTM Builder · 4th.link</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="shared.css" />
</head>
<body>
  <div id="app"></div>
  <script src="shell.js"></script>
  <script>
    const content = `
      <div class="page-header">
        <div class="page-title">
          <span>UTM Builder</span>
          <span class="title-count">0 total</span>
          <svg class="page-title-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
        <a href="create-utm.html" class="btn btn-primary">${ICONS.plus}<span>Create campaign</span><kbd>C</kbd></a>
      </div>

      <div class="list-tabs">
        <button class="list-tab active">All Active <span class="list-tab-count">0</span></button>
        <button class="list-tab">Archived <span class="list-tab-count">0</span></button>
      </div>

      <div class="toolbar">
        <button class="btn btn-outline btn-sm" disabled style="opacity:.5">${ICONS.filter}<span>Filter</span>${ICONS.chevronDown}</button>
        <button class="btn btn-outline btn-sm" disabled style="opacity:.5">${ICONS.sort}<span>Sort</span>${ICONS.chevronDown}</button>
        <div class="toolbar-spacer"></div>
        <div class="search" style="opacity:.5">${ICONS.search}<input placeholder="Search by campaign or source" disabled /></div>
      </div>

      <div class="empty">
        <div class="empty-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16"/><path d="M4 12h10"/><path d="M4 18h16"/><circle cx="18" cy="12" r="2"/></svg>
        </div>
        <h3>No campaigns yet</h3>
        <p>Build your first UTM-tagged URL to start attributing traffic to sources, mediums and campaigns.</p>
        <a href="create-utm.html" class="btn btn-primary">${ICONS.plus}<span>Create campaign</span><kbd>C</kbd></a>
      </div>
    `;
    renderShell({ activeNav: 'utm', activeSub: '', children: content });
    function toggleActionMenu(){}
  </script>
</body>
</html>
