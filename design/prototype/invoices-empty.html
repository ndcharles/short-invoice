<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Invoices · 4th.link</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="shared.css"/>
</head>
<body>
  <div id="app"></div>
  <script src="shell.js"></script>
  <script>
    const content = `
      <div class="page-header">
        <div class="page-title">
          <span>Invoices</span>
          <a href="invoice-guide.html" class="how-to-btn" title="How to Guide">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
            <span>How to Guide</span>
          </a>
          <svg class="page-title-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
        <a href="create-invoice.html" class="btn btn-primary">${ICONS.plus}<span>Create invoice</span><kbd>C</kbd></a>
      </div>

      <div class="list-tabs">
        <a class="list-tab active">All invoices <span class="list-tab-count">0</span></a>
        <a class="list-tab">Draft <span class="list-tab-count">0</span></a>
        <a class="list-tab">Sent <span class="list-tab-count">0</span></a>
        <a class="list-tab">Overdue <span class="list-tab-count">0</span></a>
        <a class="list-tab">Partially paid <span class="list-tab-count">0</span></a>
        <a class="list-tab">Paid <span class="list-tab-count">0</span></a>
        <a class="list-tab">Cancelled <span class="list-tab-count">0</span></a>
      </div>

      <div class="toolbar">
        ${renderFolderFilter('Invoices', 'green')}
        <button class="btn btn-outline btn-sm" disabled style="opacity:.5">${ICONS.filter}<span>Filter</span>${ICONS.chevronDown}</button>
        <button class="btn btn-outline btn-sm" disabled style="opacity:.5">${ICONS.sort}<span>Sort</span>${ICONS.chevronDown}</button>
        <div class="toolbar-spacer"></div>
        <div class="search" style="opacity:.5">${ICONS.search}<input placeholder="Search by number or client" disabled /></div>
      </div>

      <div class="empty">
        <div class="empty-icon">${ICONS.invoice}</div>
        <h3>No invoices yet</h3>
        <p>Create your first invoice to start billing clients and tracking payments.</p>
        <a href="create-invoice.html" class="btn btn-primary">${ICONS.plus}<span>Create invoice</span><kbd>C</kbd></a>
      </div>
    `;
    renderShell({ activeNav: 'invoice', activeSub: 'invoices', children: content });
    function toggleActionMenu(){}
  </script>
</body>
</html>
