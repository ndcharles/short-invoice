<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>New campaign · UTM Builder</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="shared.css"/>
  <style>
    .modal-body.utm { grid-template-columns: 1fr; overflow: visible; }
    .modal-body.utm .utm-layout { min-height: 0; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="shell.js"></script>
  <script>
    const bgContent = `
      <div class="page-header">
        <div class="page-title">
          <span>UTM Builder</span>
          <span class="title-count">${SAMPLE_UTMS.length} total</span>
          <svg class="page-title-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
        <a href="create-utm.html" class="btn btn-primary">${ICONS.plus}<span>Create campaign</span><kbd>C</kbd></a>
      </div>
      <div class="list-tabs">
        <button class="list-tab active">All Active <span class="list-tab-count">${SAMPLE_UTMS.length}</span></button>
        <button class="list-tab">Archived <span class="list-tab-count">0</span></button>
      </div>
      <div class="toolbar">
        ${renderFolderFilter('Campaigns', 'green')}
        <button class="btn btn-outline btn-sm">${ICONS.filter}<span>Filter</span>${ICONS.chevronDown}</button>
        <button class="btn btn-outline btn-sm">${ICONS.sort}<span>Sort</span>${ICONS.chevronDown}</button>
        <div class="toolbar-spacer"></div>
        <div class="search">${ICONS.search}<input placeholder="Search by campaign or source" /></div>
      </div>
      ${renderUtmList()}
    `;

    const modal = `
      <div class="modal-backdrop" onclick="if(event.target===this) window.location.href='utms.html'">
        <div class="modal" role="dialog" aria-label="New campaign" style="width:min(1000px,calc(100vw - 40px))">
          <div class="modal-header">
            <div class="modal-title">
              <a href="utms.html" style="color:var(--muted-foreground);text-decoration:none">UTM Builder</a>
              <span class="breadcrumb-chev">${ICONS.chevronRight}</span>
              ${ICONS.utm}
              <span>New campaign</span>
              <span class="draft-saved">
                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                Draft saved
              </span>
            </div>
            <a href="utms.html" class="modal-close">${ICONS.x}</a>
          </div>

          <div class="modal-body utm">
            <div class="utm-layout">
              <div class="utm-form-col">
                <div class="utm-form-grid">
                  <div class="field wide">
                    <label class="field-label">Website URL <span class="required-mark">*</span> <span class="field-hint">${ICONS.info}</span></label>
                    <input class="input" id="f-website" placeholder="https://www.example.com" value="https://4th.link" oninput="renderPreview()" />
                    <div class="field-help">The full website URL (e.g. <code>https://www.example.com</code>)</div>
                  </div>

                  <div class="field">
                    <label class="field-label">Campaign source <span class="required-mark">*</span></label>
                    <input class="input" id="f-source" placeholder="google" oninput="renderPreview()" />
                    <div class="field-help">The referrer (e.g. <code>google</code>, <code>newsletter</code>)</div>
                  </div>

                  <div class="field">
                    <label class="field-label">Campaign medium <span class="required-mark">*</span></label>
                    <input class="input" id="f-medium" placeholder="cpc" oninput="renderPreview()" />
                    <div class="field-help">Marketing medium (e.g. <code>cpc</code>, <code>banner</code>, <code>email</code>)</div>
                  </div>

                  <div class="field">
                    <label class="field-label">Campaign name</label>
                    <input class="input" id="f-campaign" placeholder="spring_sale" oninput="renderPreview()" />
                    <div class="field-help">Product, promo code, or slogan.</div>
                  </div>

                  <div class="field">
                    <label class="field-label">Campaign ID</label>
                    <input class="input" id="f-id" placeholder="abc_123" oninput="renderPreview()" />
                    <div class="field-help">The ads campaign ID.</div>
                  </div>

                  <div class="field">
                    <label class="field-label">Campaign term</label>
                    <input class="input" id="f-term" placeholder="running+shoes" oninput="renderPreview()" />
                    <div class="field-help">Identify the paid keywords.</div>
                  </div>

                  <div class="field">
                    <label class="field-label">Campaign content</label>
                    <input class="input" id="f-content" placeholder="logolink" oninput="renderPreview()" />
                    <div class="field-help">Use to differentiate ads.</div>
                  </div>

                  <div class="field wide">
                    <label class="field-label">Comments <span class="field-hint">${ICONS.info}</span></label>
                    <textarea class="input" id="f-comments" placeholder="Internal note — who this campaign is for, where it runs, expected volume…"></textarea>
                    <div class="field-help">Internal only. Not appended to the URL.</div>
                  </div>
                </div>
              </div>

              <div class="utm-preview-col">
                <div class="folder-block">
                  <div class="folder-label">Folder <span class="field-hint">${ICONS.info}</span></div>
                  <div class="folder-select">
                    <span class="folder-swatch green">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
                    </span>
                    <span class="folder-name">Campaigns</span>
                    <span class="folder-chev">${ICONS.chevronDown}</span>
                  </div>
                </div>

                <div class="qr-block">
                  <div class="qr-block-label">
                    <span>QR Code</span>
                    <span class="field-hint">${ICONS.info}</span>
                  </div>
                  <div class="qr-block-inner">
                    <div class="qr-thumb">${ICONS.qr}</div>
                    <div class="qr-actions">
                      <span>Auto-generated from the URL below.</span>
                      <a href="#" onclick="event.preventDefault()">${ICONS.edit} Customize</a>
                    </div>
                  </div>
                </div>

                <div class="preview-label">
                  <span>Live preview</span>
                  <span class="preview-length" id="preview-length">17 chars</span>
                </div>
                <div class="preview-card" id="preview-url"><span class="base">https://4th.link</span></div>
              </div>
            </div>
          </div>

          <div class="modal-footer">
            <div style="font-size:12px;color:var(--muted-foreground)">Required: source, medium, and campaign name or ID</div>
            <a href="utms.html" class="btn btn-primary">
              <span>Create campaign</span>
              <kbd>↵</kbd>
            </a>
          </div>
        </div>
      </div>
    `;

    renderShell({ activeNav: 'utm', activeSub: '', children: bgContent, modal });

    function encode(s){ return encodeURIComponent(s); }
    function plainUrl() {
      const v = id => document.getElementById(id).value.trim();
      const website = v('f-website') || 'https://www.example.com';
      const parts = [];
      const push = (k, val) => { if (val) parts.push(`${k}=${encode(val)}`); };
      push('utm_source',   v('f-source'));
      push('utm_medium',   v('f-medium'));
      push('utm_campaign', v('f-campaign'));
      push('utm_id',       v('f-id'));
      push('utm_term',     v('f-term'));
      push('utm_content',  v('f-content'));
      return website + (parts.length ? '?' + parts.join('&') : '');
    }
    function renderPreview() {
      const v = id => document.getElementById(id).value.trim();
      const website = v('f-website') || 'https://www.example.com';
      const parts = [];
      const push = (k, val) => { if (val) parts.push(`<span class="param-key">${k}</span><span class="sep">=</span><span class="param-val">${encode(val)}</span>`); };
      push('utm_source',   v('f-source'));
      push('utm_medium',   v('f-medium'));
      push('utm_campaign', v('f-campaign'));
      push('utm_id',       v('f-id'));
      push('utm_term',     v('f-term'));
      push('utm_content',  v('f-content'));
      let html = `<span class="base">${website}</span>`;
      if (parts.length) html += '<span class="sep">?</span>' + parts.join('<span class="sep">&amp;</span>');
      document.getElementById('preview-url').innerHTML = html;
      document.getElementById('preview-length').textContent = plainUrl().length + ' chars';
    }
    function copyUrl() {
      const url = plainUrl();
      navigator.clipboard && navigator.clipboard.writeText(url);
      const label = document.getElementById('copy-label');
      const prev = label.textContent;
      label.textContent = 'Copied!';
      setTimeout(() => label.textContent = prev, 1200);
    }
    renderPreview();

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') window.location.href = 'utms.html';
    });
    function toggleActionMenu(){}
  </script>
</body>
</html>
