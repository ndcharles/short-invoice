<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Links · 4th.link</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="shared.css"/>
</head>
<body>
  <div id="app"></div>
  <script src="shell.js"></script>
  <script>
    const content = `
      <div class="page-header">
        <div class="page-title">
          <span>Links</span>
          <span class="title-count">0 total</span>
          <svg class="page-title-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
        <a href="create-link.html" class="btn btn-primary">
          ${ICONS.plus}
          <span>Create link</span>
          <kbd>C</kbd>
        </a>
      </div>

      <div class="list-tabs">
        <button class="list-tab active">All Active <span class="list-tab-count">0</span></button>
        <button class="list-tab">Archived <span class="list-tab-count">0</span></button>
      </div>

      <div class="toolbar">
        <button class="btn btn-outline btn-sm" disabled style="opacity:.5">${ICONS.filter}<span>Filter</span>${ICONS.chevronDown}</button>
        <button class="btn btn-outline btn-sm" disabled style="opacity:.5">${ICONS.sort}<span>Sort</span>${ICONS.chevronDown}</button>
        <div class="toolbar-spacer"></div>
        <div class="search" style="opacity:.5">${ICONS.search}<input placeholder="Search by short link or URL" disabled /></div>
      </div>

      <div class="empty">
        <div class="empty-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        </div>
        <h3>No links yet</h3>
        <p>Create your first short link to start sharing and tracking clicks across your channels.</p>
        <a href="create-link.html" class="btn btn-primary">${ICONS.plus}<span>Create link</span><kbd>C</kbd></a>
      </div>
    `;
    renderShell({ activeNav: 'links', activeSub: 'links', children: content });
  </script>
</body>
</html>
