<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Invoices · Action menu</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="shared.css"/>
</head>
<body>
  <div id="app"></div>
  <script src="shell.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const rowIdx = parseInt(params.get('row') || '0', 10);

    const content = `
      <div class="page-header">
        <div class="page-title">
          <span>Invoices</span>
          <a href="invoice-guide.html" class="how-to-btn" title="How to Guide">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
            <span>How to Guide</span>
          </a>
          <svg class="page-title-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
        <a href="create-invoice.html" class="btn btn-primary">${ICONS.plus}<span>Create invoice</span><kbd>C</kbd></a>
      </div>

      <div class="list-tabs">
        <a class="list-tab active">All invoices <span class="list-tab-count">${countByStatus('all')}</span></a>
        <a class="list-tab">Draft <span class="list-tab-count">${countByStatus('draft')}</span></a>
        <a class="list-tab">Sent <span class="list-tab-count">${countByStatus('sent')}</span></a>
        <a class="list-tab">Overdue <span class="list-tab-count">${countByStatus('overdue')}</span></a>
        <a class="list-tab">Partially paid <span class="list-tab-count">${countByStatus('partially-paid')}</span></a>
        <a class="list-tab">Paid <span class="list-tab-count">${countByStatus('paid')}</span></a>
        <a class="list-tab">Cancelled <span class="list-tab-count">${countByStatus('cancelled')}</span></a>
      </div>

      <div class="toolbar">
        ${renderFolderFilter('Invoices', 'green')}
        <button class="btn btn-outline btn-sm">${ICONS.filter}<span>Filter</span>${ICONS.chevronDown}</button>
        <button class="btn btn-outline btn-sm">${ICONS.sort}<span>Sort</span>${ICONS.chevronDown}</button>
        <div class="toolbar-spacer"></div>
        <div class="search">${ICONS.search}<input placeholder="Search by number or client" /></div>
        <button class="icon-btn">${ICONS.more}</button>
      </div>

      ${renderInvoiceList('all')}
    `;
    renderShell({ activeNav: 'invoice', activeSub: 'invoices', children: content });

    requestAnimationFrame(() => {
      const cards = document.querySelectorAll('.link-card');
      const target = cards[rowIdx] || cards[0];
      if (!target) return;
      target.style.background = 'var(--muted-2)';
      target.style.boxShadow = 'var(--shadow-sm)';
      target.style.borderColor = 'var(--border-strong)';
      const btn = target.querySelector('.icon-btn');
      if (btn) {
        btn.style.background = 'var(--muted)';
        btn.style.color = 'var(--foreground)';
        const rect = btn.getBoundingClientRect();
        const dd = document.createElement('div');
        dd.className = 'dropdown';
        dd.style.top = (rect.bottom + window.scrollY + 4) + 'px';
        dd.style.left = (rect.right + window.scrollX - 190) + 'px';
        dd.style.minWidth = '190px';
        dd.innerHTML = `
          <div class="dropdown-item has-sub" data-sub="status-sub">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M2 12h20"/></svg>
            <span>Change status</span>
            <span class="kbd-hint">${ICONS.chevronRight}</span>
          </div>
          <div class="dropdown-item">${ICONS.edit}<span>Edit</span><span class="kbd-hint">E</span></div>
          <div class="dropdown-item">${ICONS.duplicate}<span>Duplicate</span><span class="kbd-hint">D</span></div>
          <div class="dropdown-item">${ICONS.send}<span>Send to client</span></div>
          <div class="dropdown-item">${ICONS.download}<span>Download PDF</span></div>
          <div class="dropdown-item">${ICONS.copy}<span>Copy link</span></div>
          <div class="dropdown-sep"></div>
          <div class="dropdown-item destructive">${ICONS.trash}<span>Delete</span><span class="kbd-hint">⌫</span></div>
        `;
        document.body.appendChild(dd);

        // Sub-flyout: status picker (opens beside the "Change status" item)
        const currentStatus = SAMPLE_INVOICES[rowIdx]?.status || 'overdue';
        const subItem = dd.querySelector('.has-sub');
        const subRect = subItem.getBoundingClientRect();
        const sub = document.createElement('div');
        sub.className = 'dropdown status-sub';
        sub.style.top = (subRect.top + window.scrollY) + 'px';
        sub.style.left = (subRect.right + window.scrollX + 4) + 'px';
        sub.style.minWidth = '190px';
        const statuses = [
          { id: 'draft',     label: 'Draft' },
          { id: 'sent',      label: 'Sent' },
          { id: 'overdue',   label: 'Overdue' },
          { id: 'cancelled', label: 'Cancelled' },
        ];
        sub.innerHTML = `
          ${statuses.map(s => `
            <div class="dropdown-item ${s.id === currentStatus ? 'is-current' : ''}">
              ${invoiceStatusPill(s.id)}
              ${s.id === currentStatus ? '<span class="kbd-hint">Current</span>' : ''}
            </div>
          `).join('')}
          <div class="dropdown-sep"></div>
          <div style="padding:6px 8px;font-size:11px;color:var(--muted-foreground);line-height:1.4">
            Use <strong>Log payment</strong> to mark as Paid/Partial.
          </div>
        `;
        document.body.appendChild(sub);
        subItem.classList.add('is-open');
      }
    });

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.dropdown') && !e.target.closest('.icon-btn')) {
        window.location.href = 'invoices.html';
      }
    }, { capture: true });

    function toggleActionMenu(){}
  </script>
</body>
</html>
