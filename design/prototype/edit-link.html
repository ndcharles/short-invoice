<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>4th.link/fa-curriculum · Edit link</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="shared.css"/>
</head>
<body>
  <div id="app"></div>
  <script src="shell.js"></script>
  <script>
    const content = `
      <div class="crumb-bar">
        <div class="crumbs">
          <a href="links.html">Links</a>
          ${ICONS.chevronRight}
          <span class="current">
            <span class="favicon google" style="width:20px;height:20px">
              <svg viewBox="0 0 24 24" width="12" height="12"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
            </span>
            4th.link/fa-curriculum
            ${ICONS.chevronDown}
          </span>
        </div>
        <div style="display:flex;align-items:center;gap:10px">
          <div class="click-stat-large">${ICONS.cursor}<strong>0</strong> <span style="color:var(--muted-foreground)">clicks</span></div>
          <button class="btn btn-outline btn-sm">${ICONS.copy}<span>Copy link</span></button>
          <button class="icon-btn">${ICONS.more}</button>
        </div>
      </div>

      <div class="edit-page-body">
        <div class="modal-left">
          <div class="field">
            <label class="field-label">Destination URL <span class="field-hint">${ICONS.info}</span></label>
            <input class="input" value="https://example.com/docs/curriculum" />
          </div>

          <div class="field" style="margin-top:14px">
            <div style="display:flex;align-items:center;gap:6px">
              <label class="field-label" style="flex:1">Short Link <span class="field-hint">${ICONS.info}</span></label>
              <span class="field-action" style="display:inline-flex;gap:10px">
                <span style="cursor:pointer" title="Edit">${ICONS.edit}</span>
                <span style="cursor:pointer" title="Copy">${ICONS.copy}</span>
              </span>
            </div>
            <div class="alias-constructor">
              <div class="alias-domain">
                <span>4th.link</span>
                ${ICONS.chevronDown}
              </div>
              <input class="alias-input" value="fa-curriculum" readonly />
            </div>
          </div>

          <div class="field" style="margin-top:14px">
            <div style="display:flex;align-items:center">
              <label class="field-label" style="flex:1">Tags <span class="field-hint">${ICONS.info}</span></label>
              <span class="field-action">Manage</span>
            </div>
            <div class="input" style="color:var(--subtle-foreground);display:flex;align-items:center;gap:6px">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
              <span>Select tags…</span>
            </div>
          </div>

          <div class="field" style="margin-top:14px">
            <label class="field-label">Comments <span class="field-hint">${ICONS.info}</span></label>
            <textarea class="input" placeholder="Add comments"></textarea>
          </div>

          <div class="tools-bar" style="margin-top:16px">
            <button class="tool-btn">${ICONS.utm}<span>UTM</span></button>
            <button class="tool-btn">${ICONS.lock}<span>Password</span></button>
            <button class="tool-btn">${ICONS.clock}<span>Expiration</span></button>
            <button class="tool-btn">${ICONS.eye}<span>Custom Preview</span></button>
            <button class="tool-btn" style="border-style:dashed;color:var(--subtle-foreground)">${ICONS.more}</button>
          </div>

          <div class="creator-note">
            <div class="avatar" style="width:20px;height:20px;font-size:10px">NC</div>
            <span>Created by <strong style="color:var(--foreground)">ndcharles</strong> · Aug 14</span>
          </div>
        </div>

        <div class="modal-right">
          <div>
            <div class="right-panel-title" style="margin-bottom:8px">
              <span style="display:inline-flex;align-items:center;gap:4px">Folder <span class="field-hint">${ICONS.info}</span></span>
            </div>
            <div class="input" style="display:flex;align-items:center;gap:8px;cursor:pointer;background:white">
              <span style="width:16px;height:16px;background:var(--accent-green);border-radius:3px;display:inline-flex;align-items:center;justify-content:center;color:var(--accent-green-fg)">
                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
              </span>
              <span style="flex:1">Links</span>
              ${ICONS.chevronDown}
            </div>
          </div>

          <div>
            <div class="right-panel-title" style="margin-bottom:8px">
              <span style="display:inline-flex;align-items:center;gap:4px">QR Code <span class="field-hint">${ICONS.info}</span></span>
            </div>
            <div class="qr-card">
              <button class="icon-btn qr-edit">${ICONS.edit}</button>
              <div class="qr">${ICONS.qr}</div>
            </div>
          </div>

          <div>
            <div class="right-panel-title" style="margin-bottom:8px">
              <span style="display:inline-flex;align-items:center;gap:4px">Custom Link Preview <span class="field-hint">${ICONS.info}</span></span>
              <div class="toggle on"><div class="toggle-switch"></div></div>
            </div>
            <div class="og-tabs" style="margin-bottom:8px">
              <div class="og-tab active">${ICONS.globe}</div>
              <div class="og-tab">${ICONS.xLogo}</div>
              <div class="og-tab">${ICONS.linkedin}</div>
              <div class="og-tab">${ICONS.facebook}</div>
            </div>
            <div class="og-preview-card">
              <div class="og-image" style="background:linear-gradient(135deg,#fafafa 0%,#f0f0f0 100%);color:var(--muted-foreground);flex-direction:column;padding:14px;align-items:flex-start;justify-content:flex-end;text-align:left">
                <button class="icon-btn edit-dot" style="background:white;box-shadow:var(--shadow-sm)">${ICONS.edit}</button>
                <div style="font-family:'Times New Roman',serif;color:#dc2626;font-weight:600;font-size:10px;letter-spacing:0.04em">VERSION 1 DRAFT</div>
              </div>
              <div class="og-body">
                <div style="font-size:12px;font-weight:600;color:var(--foreground);line-height:1.3">Version 1 Draft_ Shecluded Incubator Curriculum</div>
                <div style="font-size:11px;color:var(--muted-foreground);line-height:1.4;margin-top:2px">Version 1 Draft: Shecluded's Incubator Curriculum Thing to note about this version…</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    `;
    renderShell({ activeNav: 'links', activeSub: 'links', children: content });
    function toggleActionMenu(){}
  </script>
</body>
</html>
